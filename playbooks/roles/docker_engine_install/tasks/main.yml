---
- name: Install prerequisite packages
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
    state: latest
    update_cache: true
    cache_valid_time: 3600
  tags:
      - packages
      - docker-engine

- name: Configure Docker's repository
  ansible.builtin.deb822_repository:
    name: docker-engine
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ cpu_architecture }}"
    signed_by: https://download.docker.com/linux/debian/gpg
    install_python_debian: true
  tags:
      - packages
      - repository
      - docker-engine

- name: Install Docker engine
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: yes
  tags:
      - packages
      - docker-engine
