---
- name: Create directory for Jellyfin data and conf
  ansible.builtin.file:
    path: "{{ docker.root_path }}/jellyfin"
    state: directory
    mode: '0755'
    owner: "{{ docker.user }}"
    group: "{{ docker.user }}"
  when: docker.applications.jellyfin.version is defined
  tags:
    - multiapp
    - volumes
    - folder

- name: Template Jellyfin compose file
  ansible.builtin.template:
    src: "jellyfin/jellyfin-compose.yml.j2"
    dest: "{{ docker.root_path }}/jellyfin/jellyfin-compose.yml"
    mode: '0644'
    owner: "{{ docker.user }}"
    group: "{{ docker.user }}"
  when: docker.applications.jellyfin.version is defined
  tags:
    - multiapp
    - config
    - nextcloud

- name: Template traefik's routing configuration for jellyfin container
  ansible.builtin.template:
    src: "traefik/routing/jellyfin-routes.yml.j2"
    dest: "{{ docker.root_path }}/traefik/routing/jellyfin-routes.yml"
    mode: '0644'
    owner: "{{ docker.user }}"
    group: "{{ docker.user }}"
  tags:
    - multiapp
    - config
    - jellyfin
